<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>캠퍼스 한 바퀴 사진 탐방</title>
    <link rel="stylesheet" href="styles.css">
    <script src="game.js" defer></script>
  </head>
  <body>
    <div class="page game-page">
      <header>
        <p><a href="index.html">장소 탐험 페이지로 돌아가기</a></p>
        <h1>캠퍼스 한 바퀴 사진 탐방</h1>
        <p>캠퍼스를 걸으며 익숙한 장소를 발견해 보세요.</p>
      </header>
      <main>
        <section class="game-panel">
          <div class="game-info" aria-live="polite">
            <strong>점수 <span id="score">0</span></strong>
            <span>남은 시간 <span id="time">60</span>초</span>
            <span>등장 예정 <span id="target-count">0</span>개</span>
          </div>
          <div class="game-controls">
            <button id="start-button" type="button">게임 시작</button>
            <button id="restart-button" type="button" disabled>다시 시작</button>
          </div>
          <p id="game-status">탐방 시작 버튼을 누르면 캠퍼스 곳곳에 사진이 나타납니다.</p>
          <canvas id="game" width="860" height="520" aria-label="캠퍼스 사진 원을 클릭하는 탐방 게임"></canvas>
        </section>
      </main>
      <footer>
        <p>탐방 장소: 헬스장 · 좋아하는 길 · 자주 가는 가게</p>
        <p><a href="statistics.html">생활체육 참여율 통계 보기</a></p>
      </footer>
    </div>
  </body>
</html>
